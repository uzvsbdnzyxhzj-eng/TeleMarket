    <!-- Suppress annoying warning logs from external SDKs -->
    <script>
      const originalAlert = window.alert;
      window.alert = function(msg) {
        if (typeof msg === 'string' && (msg.includes("CloudStorage is not supported") || msg.includes("version 6.0"))) return;
        if (originalAlert) originalAlert(msg);
      };

      const methods = ['log', 'warn', 'error', 'info', 'debug'];
      methods.forEach(method => {
        const original = console[method];
        console[method] = function(...args) {
          try {
            for (let i = 0; i < args.length; i++) {
              let str = '';
              if (typeof args[i] === 'string') {
                str = args[i];
              } else if (args[i] && typeof args[i].message === 'string') {
                str = args[i].message;
              } else {
                try { str = JSON.stringify(args[i]); } catch(e) { str = String(args[i]); }
              }
              
              if (str && (str.includes("CloudStorage is not supported") || str.includes("adex timeout"))) {
                return;
              }
            }
          } catch (e) {}
          original.apply(console, args);
        };
      });

      window.addEventListener('unhandledrejection', function(event) {
        const msg = event.reason && event.reason.message ? event.reason.message : String(event.reason);
        if (msg.includes("CloudStorage is not supported") || msg.includes("adex timeout")) {
          event.preventDefault();
        }
      });

      window.addEventListener('error', function(event) {
        const msg = event.message || String(event.error);
        if (msg.includes("CloudStorage is not supported") || msg.includes("adex timeout")) {
          event.preventDefault();
        }
      });
    </script>
    <!-- Telegram Mini App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
      // Automatically expand the Telegram Mini App to full height if opened inside Telegram
      if (window.Telegram && window.Telegram.WebApp) {
        if (window.Telegram.WebApp.initData) {
          window.Telegram.WebApp.expand();
        }
        
        // Suppress Telegram web app alerts about CloudStorage
        const originalShowAlert = window.Telegram.WebApp.showAlert;
        if (originalShowAlert) {
           window.Telegram.WebApp.showAlert = function(msg, cb) {
              if (typeof msg === 'string' && (msg.includes("CloudStorage") || msg.includes("version 6.0"))) {
                 if (typeof cb === 'function') cb();
                 return;
              }
              return originalShowAlert.apply(window.Telegram.WebApp, [msg, cb]);
           };
        }
        
        const originalShowPopup = window.Telegram.WebApp.showPopup;
        if (originalShowPopup) {
           window.Telegram.WebApp.showPopup = function(params, cb) {
              if (params && typeof params.message === 'string' && (params.message.includes("CloudStorage") || params.message.includes("version 6.0"))) {
                 if (typeof cb === 'function') cb();
                 return;
              }
              return originalShowPopup.apply(window.Telegram.WebApp, [params, cb]);
           };
        }
        
        // Suppress CloudStorage error thrown by Telegram SDK when accessed by external scripts (like Monetag)
        try {
           const originalIsVersionAtLeast = window.Telegram.WebApp.isVersionAtLeast;
           if (originalIsVersionAtLeast) {
              window.Telegram.WebApp.isVersionAtLeast = function(ver) {
                 if (ver === "6.9") return true;
                 return originalIsVersionAtLeast.apply(window.Telegram.WebApp, arguments);
              };
           }
           
           const mock = function(cb, res) { if (typeof cb === 'function') cb(null, res); return Promise.resolve(res); };
           
           if (!window.Telegram.WebApp.CloudStorage) window.Telegram.WebApp.CloudStorage = {};
           
           window.Telegram.WebApp.CloudStorage.setItem = (k,v,cb) => mock(cb, true);
           window.Telegram.WebApp.CloudStorage.getItem = (k,cb) => mock(cb, "");
           window.Telegram.WebApp.CloudStorage.getItems = (k,cb) => mock(cb, {});
           window.Telegram.WebApp.CloudStorage.removeItem = (k,cb) => mock(cb, true);
           window.Telegram.WebApp.CloudStorage.removeItems = (k,cb) => mock(cb, true);
           window.Telegram.WebApp.CloudStorage.getKeys = (cb) => mock(cb, []);
        } catch (e) {
           console.error("CloudStorage stub failed", e);
        }
      }
    </script>

    <!-- Direct Link Custom Ad Controller -->
    <script>
      (function() {
        var directLink = "https://omg10.com/4/11203378";

        // Safe localStorage wrapper
        var getCount = function(key) {
          try {
            return parseInt(localStorage.getItem(key) || "0", 10);
          } catch (e) {
            return 0;
          }
        };
        var setCount = function(key, val) {
          try {
            localStorage.setItem(key, val);
          } catch (e) {}
        };

        // Aggressively unregister any service worker from old Monetag sessions
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().then(function(success) {
                if (success) {
                  console.log("[AdController] Successfully unregistered active background worker.");
                }
              });
            }
          });
        }

        function isInviteEarnElement(el) {
          if (!el) return false;
          var tagName = (el.tagName || "").toLowerCase();
          if (tagName === "input" || tagName === "textarea" || tagName === "select" || el.isContentEditable) {
            return false;
          }
          var text = (el.textContent || "").toLowerCase();
          // The banner text is "Invite & Earn" or "Invite and Earn"
          if (text.indexOf("invite & earn") > -1 || text.indexOf("invite and earn") > -1) {
            if (tagName !== "body" && tagName !== "html" && text.length < 150) {
              return true;
            }
          }
          return false;
        }

        function isContactElement(el) {
          if (!el) return false;
          var tagName = (el.tagName || "").toLowerCase();
          if (tagName === "input" || tagName === "textarea" || tagName === "select" || el.isContentEditable) {
            return false;
          }
          var href = (el.getAttribute && el.getAttribute("href") || "").toLowerCase();
          var text = (el.textContent || "").toLowerCase().trim();

          // 1. Direct href checks (Telegram / WhatsApp links)
          var hasContactHref = href.indexOf("t.me") > -1 || 
                               href.indexOf("wa.me") > -1 || 
                               href.indexOf("telegram") > -1 || 
                               href.indexOf("whatsapp") > -1;

          // 2. Text-based checks (Helplines, float buttons)
          var hasContactText = text.indexOf("telegram helpline") > -1 ||
                               text.indexOf("whatsapp helpline") > -1 ||
                               text.indexOf("telegram support") > -1 ||
                               text.indexOf("whatsapp support") > -1 ||
                               text.indexOf("telegram group") > -1 ||
                               text.indexOf("telegram channel") > -1 ||
                               text.indexOf("whatsapp chat") > -1 ||
                               text === "need help?";

          // Exclude category/buy buttons like "Buy Telegram Account" or "Sell Telegram Account"
          if (text.indexOf("buy telegram") > -1 || text.indexOf("sell telegram") > -1) {
            return false;
          }

          if (hasContactHref || hasContactText) {
            return true;
          }
          return false;
        }

        function getButtonType(target) {
          var curr = target;
          var depth = 0;

          // Block ads for any element that is admin-related (text, ID, or class containing "admin") or settings-related, or has data-ad-skip
          var checkAdmin = target;
          var adminDepth = 0;
          while (checkAdmin && checkAdmin !== document.body && adminDepth < 10) {
            var text = (checkAdmin.textContent || "").toLowerCase();
            var id = (checkAdmin.id || "").toLowerCase();
            var className = (typeof checkAdmin.className === "string" ? checkAdmin.className : (checkAdmin.className && typeof checkAdmin.className.baseVal === "string" ? checkAdmin.className.baseVal : "")).toLowerCase();
            var hasSkipAttr = checkAdmin.getAttribute && (
              checkAdmin.getAttribute("data-ad-skip") === "true" || 
              checkAdmin.getAttribute("data-skip-ad") === "true"
            );
            
            if (hasSkipAttr || 
                id.indexOf("admin") > -1 || 
                className.indexOf("admin") > -1 || 
                text.indexOf("admin") > -1 ||
                text.indexOf("settings") > -1 ||
                className.indexOf("settings") > -1 ||
                id.indexOf("settings") > -1) {
              console.log("[AdController] Ad click bypassed: Admin/settings or skipped element detected.");
              return null;
            }
            checkAdmin = checkAdmin.parentElement;
            adminDepth++;
          }

          while (curr && curr !== document.body && depth < 6) {
            if (isInviteEarnElement(curr)) {
              return "invite_earn";
            }
            if (isContactElement(curr)) {
              return "contact";
            }
            curr = curr.parentElement;
            depth++;
          }
          return null;
        }

        function handleAdDecision(e) {
          if (window.isCurrentUserAdmin) {
            console.log("[AdController] Ad click bypassed because user is Admin.");
            return;
          }
          var buttonType = getButtonType(e.target);
          if (!buttonType) return;

          if (buttonType === "invite_earn") {
            var count = getCount("ad_click_invite") + 1;
            setCount("ad_click_invite", count);
            console.log("[AdController] Invite & Earn click count:", count);
            if (count % 2 === 1) {
              console.log("[AdController] Triggering direct link for Invite & Earn (odd click)!");
              window.open(directLink, "_blank");
            }
          } else if (buttonType === "contact") {
            var count = getCount("ad_click_contact") + 1;
            setCount("ad_click_contact", count);
            console.log("[AdController] Contact click count:", count);
            if (count % 2 === 0) {
              console.log("[AdController] Triggering direct link for Contact (Telegram/WhatsApp)!");
              window.open(directLink, "_blank");
            }
          }
        }

        // Register event listener on click using capturing phase (so it runs first)
        document.addEventListener('click', handleAdDecision, true);
        window.addEventListener('click', handleAdDecision, true);
        
        // Define dummy stub to ensure no crash if any React component calls it directly
        window.triggerAdClick = function() {};
      })();
    </script>
    <!-- Page Pulse Tracking Script -->
    <script>
    (function(){
      if(window.self!==window.top)return;
      var pid="5aa53383-05de-4aff-a947-60a0a51252d0";
      var tk="8cf473a3-3053-4ed1-b25c-9260f2743940";
      var ep="https://esnubozrjxrbegatzusu.supabase.co/functions/v1/track";
      var sid=sessionStorage.getItem("_pp_sid")||Math.random().toString(36).slice(2);
      sessionStorage.setItem("_pp_sid",sid);
      var vid=localStorage.getItem("_pp_vid")||Math.random().toString(36).slice(2);
      localStorage.setItem("_pp_vid",vid);
      var lastUrl=location.href;
      function send(t,n){
        fetch(ep,{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({page_id:pid,token:tk,url:location.href,referrer:document.referrer,
            user_agent:navigator.userAgent,screen_width:screen.width,
            session_id:sid,visitor_id:vid,event_type:t,element_name:n||null})});
      }
      send("pageview");
      document.addEventListener("click",function(e){
        var el=e.target.closest("a,button,[role='button'],input[type='submit']");
        if(!el)return;
        var p=el;while(p){var s=getComputedStyle(p);if(s.position==="fixed"||s.position==="sticky"){var r=p.getBoundingClientRect();if(r.width>window.innerWidth*0.4&&r.height>window.innerHeight*0.3)return;}p=p.parentElement;}
        var name=el.getAttribute("data-pp")||el.innerText||el.getAttribute("aria-label")||el.tagName;
        if(name)send("click",name.trim().substring(0,100));
      });
      function checkUrl(){if(location.href!==lastUrl){lastUrl=location.href;send("pageview");}}
      var origPush=history.pushState;history.pushState=function(){origPush.apply(this,arguments);checkUrl();};
      var origReplace=history.replaceState;history.replaceState=function(){origReplace.apply(this,arguments);checkUrl();};
      window.addEventListener("popstate",checkUrl);
      setInterval(function(){if(!document.hidden)send("ping");},15000);
      var _cc={};window.PagePulse={trackConversion:function(label){var k=label||"_";if(_cc[k])return;_cc[k]=1;send("conversion",label||null);}};
    })();
    </script>
